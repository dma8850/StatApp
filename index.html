<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sports Stat Tracker</title>
<style>
body{font-family:Arial;margin:0;background:#f4f6f9;}
header{background:#1d3557;color:white;padding:15px;text-align:center;font-size:22px;}
nav{display:flex;background:#457b9d;}
nav button{flex:1;padding:12px;border:none;background:#457b9d;color:white;font-size:16px;cursor:pointer;}
nav button.active{background:#1d3557;}
.section{display:none;padding:15px;}
.section.active{display:block;}
table{width:100%;border-collapse:collapse;margin-bottom:20px;}
th,td{border:1px solid #ccc;padding:6px;text-align:center;}
input{width:90%;}
select{width:100%;}
.publish-btn{width:100%;padding:14px;background:#1d3557;color:white;border:none;font-size:16px;margin-top:10px;cursor:pointer;}
.summary-box{max-height:200px;overflow-y:auto;border:1px solid #ccc;padding:10px;background:white;margin-bottom:15px;}
</style>
</head>
<body>

<header>Sports Stat Tracker</header>

<nav>
<button onclick="showTab('nba')" class="active">NBA Boxscore</button>
<button onclick="showTab('epl')">EPL Match</button>
<button onclick="showTab('summary')">Summary</button>
<button onclick="showTab('standings')">NBA Standings</button>
</nav>

<!-- NBA -->
<div id="nba" class="section active">
<h2>NBA Boxscore</h2>
Team 1 <select id="nbaTeam1"></select>
<label><input type="checkbox" id="nbaWin1"> Won</label>
Team 2 <select id="nbaTeam2"></select>
<label><input type="checkbox" id="nbaWin2"> Won</label>

<h3>Team 1 Players</h3>
<table id="nbaTable1"></table>
<h3>Team 2 Players</h3>
<table id="nbaTable2"></table>
<button class="publish-btn" onclick="publishNBA()">Publish NBA Game</button>
</div>

<!-- EPL -->
<div id="epl" class="section">
<h2>EPL Match</h2>
Team 1 <select id="eplTeam1"></select>
<label><input type="checkbox" id="eplWin1"> Won</label>
Team 2 <select id="eplTeam2"></select>
<label><input type="checkbox" id="eplWin2"> Won</label>

<h3>Team 1 Players</h3>
<table id="eplTable1"></table>
<h3>Team 2 Players</h3>
<table id="eplTable2"></table>
<button class="publish-btn" onclick="publishEPL()">Publish EPL Match</button>
</div>

<!-- Summary -->
<div id="summary" class="section">
<h2>NBA Player Averages</h2>
<div id="nbaPlayerSummary" class="summary-box"></div>
<h2>NBA Team Records</h2>
<div id="nbaTeamSummary" class="summary-box"></div>
<h2>EPL Player Averages</h2>
<div id="eplPlayerSummary" class="summary-box"></div>
<h2>EPL Team Records</h2>
<div id="eplTeamSummary" class="summary-box"></div>

<button class="publish-btn" onclick="manualBackup()">Download Backup</button>
<label class="publish-btn">Upload Backup
<input type="file" accept=".json" onchange="restoreData(event)" style="display:none">
</label>
</div>

<!-- NEW: NBA Standings -->
<div id="standings" class="section">
<h2>NBA Standings</h2>
<div id="standingsTable"></div>
</div>

<script>
// Full NBA teams
const nbaTeams=[
"Atlanta Hawks","Boston Celtics","Brooklyn Nets","Charlotte Hornets","Chicago Bulls","Cleveland Cavaliers",
"Dallas Mavericks","Denver Nuggets","Detroit Pistons","Golden State Warriors","Houston Rockets","Indiana Pacers",
"Los Angeles Clippers","Los Angeles Lakers","Memphis Grizzlies","Miami Heat","Milwaukee Bucks","Minnesota Timberwolves",
"New Orleans Pelicans","New York Knicks","Oklahoma City Thunder","Orlando Magic","Philadelphia 76ers","Phoenix Suns",
"Portland Trail Blazers","Sacramento Kings","San Antonio Spurs","Toronto Raptors","Utah Jazz","Washington Wizards"
];

// Load data
let nbaPlayers=JSON.parse(localStorage.getItem("nbaPlayers")||"{}");
let nbaTeamRecords=JSON.parse(localStorage.getItem("nbaTeams")||"{}");
let eplPlayers=JSON.parse(localStorage.getItem("eplPlayers")||"{}");
let eplTeamRecords=JSON.parse(localStorage.getItem("eplTeams")||"{}");

// Tabs
function showTab(id){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
document.querySelector(`nav button[onclick="showTab('${id}')"]`).classList.add("active");

if(id==="summary") updateSummary();
if(id==="standings") renderStandings();
}

// Fill dropdowns
function fillSelect(id,list){
let sel=document.getElementById(id);
sel.innerHTML="";
list.forEach(t=>{
let o=document.createElement("option");
o.value=t;
o.text=t;
sel.appendChild(o);
});
}

// Render standings (sorted by wins)
function renderStandings(){
let teams=[];

for(let t in nbaTeamRecords){
let r=nbaTeamRecords[t];
teams.push({team:t,w:r.wins,l:r.losses});
}

// Sort by wins descending
teams.sort((a,b)=>b.w - a.w);

let html="<table><tr><th>Team</th><th>W</th><th>L</th></tr>";

teams.forEach(t=>{
html+=`<tr><td>${t.team}</td><td>${t.w}</td><td>${t.l}</td></tr>`;
});

html+="</table>";

document.getElementById("standingsTable").innerHTML=html;
}

// Keep your existing logic unchanged below...
</script>
</body>
</html>
